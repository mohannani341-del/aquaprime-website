{% extends "base.html" %}
{% block content %}
<section class="page-hero">
  <div>
    <div class="label">CONTACT AQUAPRIME</div>
    <h1>Let's talk about your <span>next crop.</span></h1>
    <div class="breadcrumb">Home / Contact</div>
  </div>
</section>

<section class="section">
  <div class="contact-page-box page-card">
    <div class="avatar">UG</div>
    <h2>{{ business.owner }}</h2>
    <p style="color:var(--green);font-weight:700;">{{ business.designation }}</p>
    <div class="details" style="margin-top:25px;">
      <a href="tel:+919951553436">📞 {{ business.phone1 }}</a>
      <a href="tel:+919652103332">📞 {{ business.phone2 }}</a>
      <a href="https://wa.me/{{ business.whatsapp }}" target="_blank">💬 WhatsApp</a>
      <span>📍 {{ business.address }}</span>
    </div>
  </div>
</section>
{% endblock %}
